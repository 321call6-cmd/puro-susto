<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PURO SUSTO — Halloween 2026 · October 31 · Tijuana</title>
  <meta name="description" content="Puro susto. Pura fiesta. Saturday, October 31, 2026, 6 PM, Salón Castilla, Tijuana. RSVP… if you dare.">

  <!--
    Esta página existe por UNA razón: la tarjeta que genera WhatsApp.
    Las etiquetas OG son fijas por URL, así que un link en español siempre
    generaría una tarjeta en español. Este archivo es la versión en inglés
    de esa tarjeta — y a la persona la manda al sitio real con ?lang=en.

    NO tiene contenido que mantener: si cambias el sitio, esto no se toca.
  -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="PURO SUSTO — Halloween 2026">
  <meta property="og:description" content="You're invited. Saturday, October 31 · 6 PM · Salón Castilla, Tijuana, Mexico. Come in and RSVP… if you dare.">
  <meta property="og:url" content="https://puro-susto.pages.dev/en/">
  <meta property="og:image" content="https://puro-susto.pages.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PURO SUSTO — Halloween 2026">
  <meta name="twitter:description" content="You're invited. October 31 · Salón Castilla, Tijuana, Mexico. Come in and RSVP… if you dare.">
  <meta name="twitter:image" content="https://puro-susto.pages.dev/og-image.png">

  <link rel="canonical" href="https://puro-susto.pages.dev/?lang=en">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">

  <!-- El salto es SOLO por JavaScript, a propósito.
       Un meta refresh lo siguen también los rastreadores, y entonces WhatsApp
       acabaría leyendo las etiquetas en español de la portada — justo lo que
       esta página existe para evitar. WhatsApp y Facebook no ejecutan JS:
       leen las etiquetas de arriba y se detienen. Una persona sí salta. -->
  <script>location.replace('/?lang=en');</script>

  <style>
    body {
      background: #0B0B0D; color: #F2EDE4;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; text-align: center; padding: 20px;
    }
    a { color: #C1121F; }
  </style>
</head>
<body>
  <p>Taking you to <a href="/?lang=en">PURO SUSTO</a>…</p>
</body>
</html>
